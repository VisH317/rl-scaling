# Stellar GPU QOS: 2 RUNNING jobs, 8 GPUs, 2 nodes per user. Pending is unlimited,
# which is why `submit=chain` can queue a whole grid that self-sequences.
account: mae
partition: gpu
max_running_jobs: 2
max_gpus: 8
max_nodes: 2
gpus_per_job: 2        # 2, not 4: the only 8-GPU node (stellar-k09g1) was down
                       # 2026-11-05, so a 1-node 4-GPU request is unschedulable.
                       # Re-check `sinfo -p gpu` before raising this.
runs_per_gpu: 3        # validated by smoke check 8 (3/3 co-resident runs finished)
xla_mem_fraction: 0.28 # JAX preallocates 75% by default; must be lowered to pack
cpus_per_run: 4
mem_per_cpu: 4000M     # the 7500M default breaks on the AMD GPU nodes (512/128=4GB/core)
time_limit: "24:00:00" # NOT the 7-day max: Stellar reserves the 2nd Tuesday monthly
                       # and will not start a job that can't finish before it.
stagger_seconds: 20
deadline_margin_s: 1200
max_attempts: 3
