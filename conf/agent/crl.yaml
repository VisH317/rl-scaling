# OGBench impls/agents/crl.py defaults. Per-environment published flags from
# hyperparameters.sh are applied on top when use_published_flags=true -- on
# antmaze-medium-stitch that means actor_p_trajgoal 1.0 -> 0.5 and randomgoal 0.0 -> 0.5.
agent: crl
recipe: ogbench
critic_loss: binary_nce    # what BOTH offline codebases do  (open question Q1)
logits: dot
logsumexp_penalty: 0.0
batch_size: 1024
discount: 0.99
alpha: 0.1                 # BC coefficient in DDPG+BC
actor_loss: ddpgbc
critic_ensemble: 2
const_std: true
value_p_curgoal: 0.0
value_p_trajgoal: 1.0
value_p_randomgoal: 0.0
value_geom_sample: true    # geometric + end-clipping => 43.6% of positives are the
                           # trajectory's final state on antmaze-medium-stitch (§1.8)
actor_p_curgoal: 0.0
actor_p_trajgoal: 1.0
actor_p_randomgoal: 0.0
actor_geom_sample: false
use_published_flags: true
