# OGBench impls/agents/gcbc.py defaults. The published antmaze-medium-stitch command
# (hyperparameters.sh L158) passes NO agent flags, so these are already correct.
# GCBC is the control: same architecture and data, no critic.
agent: gcbc
recipe: ogbench
critic_loss: binary_nce    # unused
logits: dot                # unused
logsumexp_penalty: 0.0
batch_size: 1024
discount: 0.99             # goal sampling only
alpha: 0.1                 # unused
actor_loss: ddpgbc         # unused
critic_ensemble: 2         # unused
const_std: true
value_p_curgoal: 0.0
value_p_trajgoal: 1.0
value_p_randomgoal: 0.0
value_geom_sample: false
actor_p_curgoal: 0.0
actor_p_trajgoal: 1.0
actor_p_randomgoal: 0.0
actor_geom_sample: false
use_published_flags: true
