# @package _global_
# The corner of the depth x data grid. Fill the rest ONLY if a trend shows here.
defaults:
  - override /dataset: cube_double_play_100m
  - override /arch: residual
experiment:
  name: phase3_corner
  depths: [4, 16, 64]
  sizes: [100000, 1000000, 10000000]
  agents: [crl, gcbc]
  seeds: [0, 1, 2]
  note: 9 cells x 2 algorithms x 3 seeds = 54 runs.
