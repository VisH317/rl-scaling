# @package _global_
# Phase 5 skeleton: actor depth sweep against a frozen critic. The freezing logic is
# NOT implemented yet -- this preset exists so the axis is declared in one place.
defaults:
  - override /dataset: cube_double_play_100m
  - override /arch: residual
experiment:
  name: actor_thread
  depths: [4, 8, 16, 32, 64]     # ACTOR depth; critic comes from a checkpoint
  sizes: [1000000, 10000000]
  agents: [crl]
  seeds: [0, 1, 2]
  note: >-
    NOT YET RUNNABLE -- frozen-critic loading is unimplemented. Declares the phase-5
    axes: actor depth x extraction method against a fixed critic.
