# THE BASELINE, and deliberately plain. Verified identical in both references:
#   OGBench  impls/agents/crl.py:285   optax.adam(learning_rate=config['lr'])
#   scaling-crl train.py:541,556       optax.adam(learning_rate=3e-4)
# No schedule, no warmup, no clipping, no weight decay. The 1000-layer paper's
# stability at extreme depth came from the ARCHITECTURE, not optimizer tricks --
# and warmup/clipping help deep nets specifically, so switching either on would
# confound the very axis under test. Deviations are recorded per run.
optimizer: adam
lr: 3.0e-4
actor_lr: null      # null -> lr
critic_lr: null     # null -> lr
b1: 0.9
b2: 0.999
eps: 1.0e-8
weight_decay: 0.0
schedule: constant
warmup_steps: 0
end_lr_fraction: 0.1
max_grad_norm: 0.0  # 0 = unclipped
