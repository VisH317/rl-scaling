# Linear probes on the critic's representations. See README.md for the design and
# impl.py's docstring for which target belongs to which site -- phi and psi cannot
# see each other, so a pair property is probed from their concatenation and a goal
# property is computed on the goal observation.
name: state_probes
title: What the critic's representations linearly encode about the state
status: ready
doc: README.md
module: impl
figures: figures

applies_to: [crl]
requires: [critic]
env_family: [locomaze]

params:
  state_source: val
  # --- what is probed -------------------------------------------------------
  sites: [psi_goal, phi_state_action, phi_psi_concat]  # +block_k once activation
                                                       #  capture exists
  # Subsampling INSIDE each kept trajectory. Neighbouring rows are 0.05 s apart and
  # near-duplicates, so every 20th costs almost nothing and keeps the solves small.
  state_stride: 20
  max_states: 20000
  # --- what it is probed FOR ------------------------------------------------
  targets:
    - xy                 # regression. Dims 0:2 of the observation -- a LEAK CHECK,
                         #   not a result: anything that keeps the input scores 1.0.
    - maze_cell          # 26-way classification. Chance = largest-class frequency.
    - geodesic_to_task   # regression, one column per task goal. The headline.
    - steps_to_goal      # regression. Remaining steps to the trajectory's own end.
    - body_height        # regression. Control: a non-spatial body coordinate.
                         #   ant = qpos[2] (torso z); humanoid = head_height,
                         #   since the humanoid observation omits the root z.
    - joint_vel_norm     # regression. Control: should NOT improve with depth.
  # --- method ---------------------------------------------------------------
  split: trajectory      # NEVER `state`: neighbouring states are near-duplicates
  # A CAP, not a demand: the humanoid val shard has 100 trajectories against this
  # request for 500, so the split falls back to the same ratio of whatever exists and
  # records the counts actually used.
  n_train_trajs: 400
  n_test_trajs: 100
  ridge_lambdas: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0, 10.0, 100.0]
  cv_folds: 5
  standardize: true
  # --- controls (each one is a separate fit; none is optional) --------------
  baselines: [raw_obs, random_init, label_shuffle]
  seed: 0

resources:
  time_limit: "01:00:00"
  cpus: 8
  mem_per_cpu: 4000M
  gpu: 1
