# ===========================================================================
# THE EVAL SUITE. One file; `src/eval.py` compiles it into a Slurm job.
#
#   $V src/eval.py                      # show the plan (nothing is written)
#   $V src/eval.py --write              # write the task files
#   $V src/eval.py --submit             # write + queue one job
#   $V src/eval.py --figures            # rebuild figures from finished tasks
#   $V src/eval.py --list               # every eval that exists, and its status
#
# Point it at a different suite file with a positional argument.
# ===========================================================================

name: interp01

# --- which checkpoints the suite runs on -----------------------------------
# Both locomaze grids. They share the same 8x8 maze and the same five (start, goal)
# cell pairs, so every spatial metric is defined identically in both -- but the bodies,
# the datasets and `critic_ensemble` differ, so figures are drawn one COMPLETE SET PER
# GRID and never pooled into shared panels.
grids: [phase1_repro, humanoid_ensemble1]
agents: [crl]                    # an eval that does not apply to an agent is dropped
depths: [4, 8, 16, 32]

# How the one checkpoint per (grid, agent, depth) is chosen:
#   reeval        the 50-episodes/task rescore -- the number the report quotes
#   best_success  the best training-time eval (15 episodes/task)
#   last3         mean of the final three training evals
#   all           no selection; every seed becomes its own task
# `all` since 2026-11-06: every seed becomes its own task. One seed cannot show
# whether a depth trend survives seed noise, and `interp__critic_depth`'s headline
# claims (rho falling on antmaze, action_topology_gain rising) were each read off a
# single run. Metric figures now plot mean +/- 1 SD over seeds with the seeds as dots;
# the image grids still show one seed per depth, or a 4-depth x 3-seed x 5-task suite
# would render 60 panels. Cost scales with the seed count: ~3x on antmaze, 2x humanoid.
seed_select: all
checkpoint: best                 # params_<checkpoint>.pkl

# false also admits runs that are still training, scored from the tail of eval.csv
# and labelled `in_flight@<step>` everywhere they appear. Use it to look early; never
# to quote a number.
require_finished: true

# --- which evals to run ----------------------------------------------------
# `params` here override that eval's own eval.yaml, key by key.
evals:
  - name: critic_heatmap
    params:
      cell_subdiv: 4
      goal_samples: 8
      # `dataset` is what makes fig3 (the advantage field, Q(policy) - Q(dataset))
      # possible: without it that figure has no data and figures.py skips it.
      action_sources: [policy, oracle_geodesic, oracle_euclid, dataset]
      direction_split_deg: 45.0

  - name: state_probes
    params:
      state_stride: 20
      max_states: 20000
